<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>ATRIA sign-in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap">
<style>
  :root {
    --bg: #e6ecf5;
    --card: #eef2f8;
    --text: #1f2a3d;
    --muted: #5b6b82;
    --brand: #1e88e5;
    --shadow-dark: rgba(163, 177, 198, 0.6);
    --shadow-light: rgba(255, 255, 255, 0.9);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141a24;
      --card: #1a2230;
      --text: #e6ecf5;
      --muted: #9aa8bd;
      --brand: #64b5f6;
      --shadow-dark: rgba(0, 0, 0, 0.5);
      --shadow-light: rgba(255, 255, 255, 0.04);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter';
  }
  main {
    width: 100%;
    max-width: 420px;
    padding: 40px 32px;
    border-radius: 24px;
    background: var(--card);
    box-shadow: 10px 10px 24px var(--shadow-dark), -10px -10px 24px var(--shadow-light);
    text-align: center;
  }
  .brand { margin: 0 0 24px; font-size: 22px; font-weight: 800; letter-spacing: 0.18em; color: var(--brand); }
  h1 { margin: 0 0 12px; font-size: 24px; font-weight: 600; }
  p { margin: 0; color: var(--muted); line-height: 1.6; }
  #detail { margin-top: 12px; }
  #detail:empty { display: none; }
</style>
</head>
<body>
<main>
  <p class="brand">ATRIA</p>
  <h1 id="title"></h1>
  <p id="message"></p>
  <p id="detail"></p>
</main>
<script>
  // Supabase sends the Windows app's Google sign-in here, with ?code=... or,
  // when it failed, ?error=.... Pass that on to the ATRIA app, which finishes
  // signing in, and keep this page in the tab: the app can't close the tab.
  const params = new URLSearchParams(location.search);
  const title = document.getElementById('title');
  const message = document.getElementById('message');
  const detail = document.getElementById('detail');

  if (params.has('code')) {
    title.textContent = 'Signed in with Google';
    message.textContent = 'ATRIA is opening. You can close this tab.';
  } else if (params.has('error')) {
    title.textContent = "Sign-in didn't finish";
    message.textContent = 'Go back to ATRIA to try again. You can close this tab.';
    detail.textContent = params.get('error_description');
  } else {
    title.textContent = 'Nothing to finish here';
    message.textContent = 'This page completes sign-in for the ATRIA app. Start sign-in from the app.';
  }

  if (params.has('code') || params.has('error')) {
    location.replace('com.syvursoft.atria://auth-callback' + location.search);
  }
</script>
</body>
</html>
